name: CI Diag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  diag:
    name: Diag ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run all tests, capture full output
        run: |
          {
            echo "OS: ${{ matrix.os }}"
            python -c "import sys,platform;print('python',sys.version.split()[0]);print('platform',platform.platform())"
            for t in test_smoke.py test_m2.py test_m34.py test_m6.py test_edge_cases.py test_m7.py test_m8_recalc.py test_m9_conditional.py test_m10_pivot.py; do
              echo "===== $t ====="
              python "tests/$t" 2>&1
              echo "----- exit=$? -----"
            done
          } > full.log 2>&1
          echo "=== FULL LOG START ==="
          cat full.log
          echo "=== FULL LOG END ==="
      - name: Publish log to Issue
        if: always()
        run: |
          B64=$(base64 -w0 full.log)
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"CI-DIAG-${{ matrix.os }}-run${{ github.run_number }}\",\"body\":\"$B64\"}"
