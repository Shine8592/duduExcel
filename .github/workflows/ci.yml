name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        # test_m8_recalc.py self-skips the real-recalc part when LibreOffice is absent,
        # so CI without LibreOffice still passes.
        run: |
          python tests/test_smoke.py
          python tests/test_m2.py
          python tests/test_m34.py
          python tests/test_m6.py
          python tests/test_edge_cases.py
          python tests/test_m7.py
          python tests/test_m8_recalc.py
          # 补齐此前遗漏的 M9/M10（此前 CI 从未跑过这两个）
          python tests/test_m9_conditional.py
          python tests/test_m10_pivot.py
          # P1 新增：格式语义可查询（差异化能力，必须守住）
          python tests/test_format_scan.py
          # P2 新增：数据验证 / 去重 / 查找替换（对标头名补齐）
          python tests/test_bulk_ops.py

      - name: Verify CLI entry point
        run: python -c "import duduexcel, duduexcel.server; print('import OK')"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
