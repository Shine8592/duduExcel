name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # 显式 UTF-8：避免非 UTF-8 locale（含部分 Linux runner）下中文输出报错
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Environment info
        run: |
          python -c "import sys, platform, locale; print('python:', sys.version.split()[0]); print('platform:', platform.platform()); print('preferred encoding:', locale.getpreferredencoding())"

      - name: Run test suite
        shell: bash
        run: |
          set +e
          fail=0
          for t in test_smoke.py test_m2.py test_m34.py test_m6.py test_edge_cases.py test_m7.py test_m8_recalc.py test_m9_conditional.py test_m10_pivot.py; do
            echo "===== running $t ====="
            python "tests/$t"
            code=$?
            echo "----- $t exit=$code -----"
            if [ $code -ne 0 ]; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          echo "overall_fail=$fail"
          exit $fail

      - name: Verify CLI entry point
        run: python -c "import duduexcel, duduexcel.server; print('import OK')"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
