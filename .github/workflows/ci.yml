name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    name: Diagnose on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run each test and capture errors
        shell: bash
        run: |
          mkdir -p diag
          for t in test_smoke.py test_m2.py test_m34.py test_m6.py test_edge_cases.py test_m7.py test_m8_recalc.py test_m9_conditional.py test_m10_pivot.py; do
            echo "===== $t ====="
            python "tests/$t" > "diag/$t.out" 2> "diag/$t.err"
            code=$?
            echo "$t exit=$code" >> diag/summary.txt
            if [ $code -ne 0 ]; then
              echo "FAILED: $t (exit=$code)"
              echo "---- stdout ----"
              tail -30 "diag/$t.out"
              echo "---- stderr ----"
              tail -40 "diag/$t.err"
            fi
          done
          echo "=== SUMMARY ==="
          cat diag/summary.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.os }}
          path: diag/
