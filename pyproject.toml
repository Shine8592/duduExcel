[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duduexcel"
version = "0.2.0"
description = "Excel MCP server for AI agents: context-efficient (server-side aggregation), safe writes (atomic save + backup + rollback), format semantics (strikethrough/highlight), formula recalculation, and first-class Chinese support."
readme = { file = "README_EN.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shine8592" }]
keywords = [
    "excel", "xlsx", "spreadsheet", "mcp", "model-context-protocol",
    "ai-agent", "llm", "openpyxl", "pandas", "automation", "chinese",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openpyxl>=3.1.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
# 服务端聚合分析（filter_count / aggregate / top_n / join / compare 需要）
analysis = ["pandas>=2.0.0"]
# 开发与发布
dev = [
    "pandas>=2.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Shine8592/duduExcel"
Repository = "https://github.com/Shine8592/duduExcel"
Issues = "https://github.com/Shine8592/duduExcel/issues"
Changelog = "https://github.com/Shine8592/duduExcel/blob/main/CHANGELOG.md"

[project.scripts]
duduexcel = "duduexcel.__main__:main"

[tool.setuptools.packages.find]
include = ["duduexcel*"]

[tool.setuptools.package-data]
duduexcel = ["py.typed"]
